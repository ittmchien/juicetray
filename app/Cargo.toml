[package]
name = "juicetray"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
directories = "6"
juicetray-bluetooth = { path = "../crates/bluetooth" }
juicetray-door = { path = "../crates/door" }
juicetray-protocol = { path = "../crates/protocol" }
# Windows falls back to a system font file, so the compiled-in font is off there (`-p juicetray`
# builds; a workspace-wide build turns it back on through feature unification).
juicetray-strip-render = { path = "../crates/strip-render", default-features = false }
juicetray-ui-model = { path = "../crates/ui-model" }
# Desktop notifications only; the default features pull in the Linux D-Bus stack.
notify-rust = { version = "4", default-features = false }
# Native SVG file picker; the default features are the Linux GTK / portal backends.
rfd = { version = "0.18", default-features = false }
tao = { version = "0.37", default-features = false }
toml = "1"
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
juicetray-strip-render = { path = "../crates/strip-render", features = ["embedded-font"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSFont",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSArray",
    "NSBundle",
    "NSDistributedNotificationCenter",
    "NSGeometry",
    "NSNotification",
    "NSOperation",
    "NSString",
] }
objc2-service-management = "0.3"

# Matched against the build host: only a Windows host can compile the icon resource.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
