[package]
name = "juicetray-strip-render"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[lib]
name = "strip_render"

[dependencies]
juicetray-ui-model = { path = "../ui-model" }
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
# PNG output for the preview example only.
tiny-skia = { version = "0.12", features = ["png-format"] }
