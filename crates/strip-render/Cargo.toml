[package]
name = "juicetray-strip-render"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[lib]
name = "strip_render"

[features]
# Inter Medium compiled in as the fallback font (about 400 KB); the Windows app turns it off and
# falls back to a system font file instead.
default = ["embedded-font"]
embedded-font = []

[[example]]
name = "preview"
required-features = ["embedded-font"]

[dependencies]
juicetray-ui-model = { path = "../ui-model" }
anyhow = "1"
# resvg re-exports usvg and tiny_skia, so they stay one version; no text, raster or system-font features.
resvg = { version = "0.50", default-features = false }
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
memmap2 = "0.9"

[dev-dependencies]
# PNG output for the preview example only.
tiny-skia = { version = "0.12", features = ["png-format"] }
