name: ci

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# Official releases (main, v* tags) build without the step trace; dev and PR builds keep it.
env:
  JUICETRAY_CHANNEL: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'stable' || 'beta' }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Builds both Apple architectures, joins them, ad-hoc signs and zips the app.
      - run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: juicetray-macos-universal
          path: target/juicetray-macos-universal.app.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p juicetray
      # The embedded manifest is plain XML inside the exe; a missing one fails the job.
      - name: Check embedded manifest
        shell: cmd
        run: findstr /c:"supportedOS" target\release\juicetray.exe
      - name: Name the artifact
        shell: pwsh
        run: Copy-Item target/release/juicetray.exe juicetray-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: juicetray-windows-x86_64
          path: juicetray-windows-x86_64.exe
          if-no-files-found: error

  release:
    # A merge into main publishes the Cargo.toml version once (tag and release); a pushed v* tag
    # still publishes by hand.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # Ships the Windows exe and the macOS app zip (the Homebrew formula installs that zip).
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A version already released is never published twice.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: juicetray-*
          path: dist
          merge-multiple: true
      # The app's self-update checks the downloaded exe against this list before replacing itself.
      - name: Checksums
        if: steps.version.outputs.publish == 'true'
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # The release text comes from RELEASE_NOTES.md, written on dev before the release PR.
          body_path: RELEASE_NOTES.md
          files: dist/*
