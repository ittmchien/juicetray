name: ci

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Builds both Apple architectures, joins them, ad-hoc signs and zips the app.
      - run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: juicetray-macos-universal
          path: target/juicetray-macos-universal.app.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p juicetray
      # The embedded manifest is plain XML inside the exe; a missing one fails the job.
      - name: Check embedded manifest
        shell: cmd
        run: findstr /c:"supportedOS" target\release\juicetray.exe
      - name: Name the artifact
        shell: pwsh
        run: Copy-Item target/release/juicetray.exe juicetray-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: juicetray-windows-x86_64
          path: juicetray-windows-x86_64.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
